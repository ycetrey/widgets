<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#374151" stroke-width="3"/>
  <!-- Git Pull Request branch lines -->
  <circle cx="42" cy="40" r="10" fill="#60a5fa"/>
  <circle cx="42" cy="88" r="10" fill="#60a5fa"/>
  <circle cx="86" cy="64" r="10" fill="#34d399"/>
  <!-- Main stem -->
  <line x1="42" y1="50" x2="42" y2="78" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- Branch curve -->
  <path d="M 42 78 C 42 64, 60 64, 76 64" fill="none" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- Notification dot -->
  <circle cx="98" cy="30" r="10" fill="#ef4444" stroke="#111827" stroke-width="3"/>
</svg>
